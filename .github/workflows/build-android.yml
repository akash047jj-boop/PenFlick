name: PenFlick Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK
        run: |
          set -eux
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -L --fail --retry 5 "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip" -o /tmp/android-tools.zip
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/android-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          adb version
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Java 17
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

      - name: Install Godot 4.4.1
        run: |
          set -eux
          curl -L --fail --retry 5 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 5 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TEMPLATE_ROOT=$(find /tmp/templates -type f -name 'android_debug.apk' -printf '%h' | head -n 1)
          test -n "$TEMPLATE_ROOT"
          cp "$TEMPLATE_ROOT"/android_debug.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          cp "$TEMPLATE_ROOT"/android_release.apk "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          ls -lh "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android editor settings
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/home/runner/android-sdk"
          export/android/debug_keystore = "/home/runner/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Validate project
        run: |
          set -eux
          godot --headless --path . --editor --quit

      - name: Runtime script validation
        run: |
          set -euxo pipefail
          godot --headless --path . --quit-after 2 2>&1 | tee /tmp/godot-runtime.log
          if grep -Eq "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-runtime.log; then
            echo "Godot runtime validation found a script error."
            exit 1
          fi

      - name: Configure Android debug keystore
        run: |
          set -eux
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure export preset keystore
        run: |
          set -eux
          sed -i 's|^keystore/debug=.*$|keystore/debug="/home/runner/debug.keystore"|' export_presets.cfg
          sed -i 's|^keystore/debug_user=.*$|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/debug_password=.*$|keystore/debug_password="android"|' export_presets.cfg
          sed -i 's|^keystore/release=.*$|keystore/release="/home/runner/debug.keystore"|' export_presets.cfg
          sed -i 's|^keystore/release_user=.*$|keystore/release_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|^keystore/release_password=.*$|keystore/release_password="android"|' export_presets.cfg
          grep -E '^keystore/(debug|release)' export_presets.cfg
          keytool -list -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Export debug APK
        run: |
          set -eux
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/PenFlick-debug.apk
          test -s build/PenFlick-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenFlick-debug-apk
          path: build/PenFlick-debug.apk
          if-no-files-found: error
