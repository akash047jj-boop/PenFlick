name: Build PenFlick Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK and Godot templates
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable
          cp /root/.local/share/godot/export_templates/4.4.1.stable/android_source.zip /github/home/.local/share/godot/export_templates/4.4.1.stable/
          cp /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk /github/home/.local/share/godot/export_templates/4.4.1.stable/
          cp /root/.local/share/godot/export_templates/4.4.1.stable/android_release.apk /github/home/.local/share/godot/export_templates/4.4.1.stable/
          echo "Android template copied to CI HOME."
          test -s /github/home/.local/share/godot/export_templates/4.4.1.stable/android_source.zip
          mkdir -p android/build
          unzip -q /github/home/.local/share/godot/export_templates/4.4.1.stable/android_source.zip -d android/build
          echo "Installed Gradle Android project:"
          test -f android/build/build.gradle
          mkdir -p /github/home/.config/godot
          cat > /github/home/.config/godot/editor_settings-4.tres <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
EOF
          echo "Godot Android SDK/JDK settings configured."

      - name: Create temporary Android debug keystore
        run: |
          keytool -genkeypair -v             -keystore /tmp/penflick-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/penflick-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        timeout-minutes: 10
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/PenFlick-debug.apk
          test -s build/PenFlick-debug.apk
          ls -lh build/PenFlick-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenFlick-debug
          path: build/PenFlick-debug.apk
