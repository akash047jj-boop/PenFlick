name: Build PenFlick Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Godot templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            cp -r /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/
          fi

      - name: Create temporary Android debug keystore
        run: |
          keytool -genkeypair -v             -keystore /tmp/penflick-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Validate project
        run: |
          godot --headless --path . --editor --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/penflick-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/PenFlick-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenFlick-debug
          path: build/PenFlick-debug.apk
